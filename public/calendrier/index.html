<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planification du rendez-vous | HUVI Optimisation</title>
  <meta name="description" content="Planifiez votre rendez-vous avec HUVI Optimisation.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://huvioptimisation.com/calendrier">
  <meta property="og:title" content="Planification du rendez-vous | HUVI Optimisation">
  <meta property="og:description" content="Sélectionnez la date et l'heure qui vous convient le mieux.">
  <meta property="og:image" content="https://huvioptimisation.com/favicon.png">
  <meta property="og:locale" content="fr_CA">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #253551;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 20px 24px 12px;
      flex-shrink: 0;
      width: 100%;
      max-width: 600px;
    }

    /* Logo */
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .logo-img {
      height: 50px;
      width: auto;
    }
    @media (min-width: 640px) {
      .logo-img { height: 60px; }
    }

    /* Calendar */
    .calendar {
      width: 100%;
      flex-grow: 1;
      position: relative;
      overflow: hidden;
    }
    .calendar-inner {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <img class="logo-img" src="logo.png" alt="HUVI Optimisation">
    </div>
  </div>

  <div class="calendar">
    <div class="calendar-inner"
      data-fillout-id="kpMEhrYBULus"
      data-fillout-embed-type="fullscreen"
      style="width:100%;height:100%;"
      data-fillout-inherit-parameters></div>
  </div>

  <script src="https://server.fillout.com/embed/v1/"></script>
</body>
</html>
